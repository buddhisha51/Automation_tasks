---
- name: configure cisco cisco_routers
  hosts: router1
  gather_facts: false

  tasks:
    - name: create multiple loopbacks
      cisco.ios.ios_config:
        lines:
          - ip address {{item.ip}} {{item.subnet}}
          - description {{item.description}}
        parents: interface Loopback{{item.id}}
      loop: "{{new_loopbacks}}"